# Lint configuration for the backend. Run from backend/:
#
#     ruff check .
#
# (See CONTRIBUTING.md in the repository root for the full conventions.)

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# E4/E7/E9 = basic pycodestyle errors, F = pyflakes (unused imports, ...),
# D = pydocstyle — the docstring rules that enforce the comment standard.
select = ["E4", "E7", "E9", "F", "D"]

[tool.ruff.lint.pydocstyle]
# PEP 257 docstring style — matches the prose docstrings used in this codebase.
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Alembic migrations and env.py are (mostly) auto-generated — exempt from
# the docstring rules. F403 stays ignored here too: env.py deliberately
# does `from app.models import *` so every table registers with Base.metadata.
"alembic/**" = ["D", "F403"]