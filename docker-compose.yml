services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fakeacademy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}
      POSTGRES_DB: ${POSTGRES_DB:-fakeacademy}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER?}"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: chrislusf/seaweedfs:latest
    command: "server -dir=/data -s3"
    environment:
      # No S3 auth for now (internal Compose network only); keys will
      # be added when configuring identity in SeaweedFS
      WEED_S3_URL: http://storage:8333
    ports:
      - "8888:8888"      # filer web UI (browse stored files)
    volumes:
      - seaweeddata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fakeacademy}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}@db:5432/${POSTGRES_DB:-fakeacademy}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is not set}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      FRONTEND_ENDPOINT: ${FRONTEND_ENDPOINT:-http://localhost:5173}
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"     # host:container — Vite dev server
    depends_on:
      - backend

volumes:
  pgdata:
  seaweeddata: